name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exercise-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10.0.x
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Lab-01/Exercise.sln

      - name: Build solution
        run: dotnet build Lab-01/Exercise.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Lab-01/Exercise.sln --configuration Release --no-build --verbosity normal