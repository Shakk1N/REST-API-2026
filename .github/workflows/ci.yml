name: .NET CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.lab }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        lab: [Lab-01, Lab-02]

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exercise-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.lab }}/Exercise.sln

      - name: Build solution
        run: dotnet build ${{ matrix.lab }}/Exercise.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ${{ matrix.lab }}/Exercise.sln --configuration Release --no-build --verbosity normal
